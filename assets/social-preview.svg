<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1200" y2="650" gradientUnits="userSpaceOnUse">
