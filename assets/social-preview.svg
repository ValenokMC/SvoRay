      <stop offset="0.55" stop-color="#142849"/>
      <stop offset="1" stop-color="#261739"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="120" x2="760" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A7CFF"/>
      <stop offset="0.5" stop-color="#4E7CF4"/>
      <stop offset="1" stop-color="#2DD6B7"/>
