    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(295 136) rotate(35) scale(470 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7779FF" stop-opacity="0.3"/>
