version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    ignore:
      - dependency-name: ReactiveUI
        update-types:
          - version-update:semver-major
      - dependency-name: ReactiveUI.WPF
        update-types:
          - version-update:semver-major
      - dependency-name: ReactiveUI.Avalonia
        versions:
          - "[12.1.0,)"
